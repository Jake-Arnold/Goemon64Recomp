name: Japan port metadata checks

on:
  push:
    branches:
      - feature/japan-native-recomp
  pull_request:
    paths:
      - "tools/japan_port/**"
      - ".github/workflows/japan-port-metadata.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch pinned N64ModernRuntime for native source tests
        run: git submodule update --init --recursive lib/N64ModernRuntime
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install metadata parser dependency
        run: python -m pip install "PyYAML==6.0.2"
      - name: Unit tests (no ROMs or game assets)
        run: python -m unittest discover -s tools/japan_port -p "test_*.py" -v
      - name: Check native ROM decompressor for USA and Japan
        run: c++ -std=c++20 -Iinclude -Wall -Wextra -fsyntax-only src/game/rom_decompression.cpp
      - name: Run synthetic USA and Japan native decompression regression
        run: |
          c++ -std=c++20 -O2 -Iinclude -Wall -Wextra \
            src/game/rom_decompression.cpp tools/japan_port/test_runtime_decompression.cpp \
            -o /tmp/goemon-region-decompression-test
          /tmp/goemon-region-decompression-test
