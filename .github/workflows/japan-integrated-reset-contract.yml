name: Japanese integrated F8 reset source contracts

on:
  push:
    branches:
      - feature/japan-integrated-f8-reset-experimental
    paths:
      - 'tools/japan_port/patch_integrated_reset_experiment.py'
      - 'tools/japan_port/test_integrated_reset_experiment.py'
      - 'tools/japan_port/test_integrated_reset_gates.cpp'
      - 'src/game/jp_generation_publisher_gate.hpp'
      - 'src/game/jp_timer_epoch_clock.hpp'
      - '.github/workflows/japan-integrated-reset-contract.yml'
  pull_request:
    paths:
      - 'tools/japan_port/**'
      - 'src/game/jp_generation_publisher_gate.hpp'
      - 'src/game/jp_timer_epoch_clock.hpp'
      - '.github/workflows/japan-integrated-reset-contract.yml'

permissions:
  contents: read

jobs:
  pinned-generator-and-host-gates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch pinned open-source runtime only
        run: git submodule update --init --recursive lib/N64ModernRuntime
      - name: Compile reset generator Python
        run: python3 -m py_compile tools/japan_port/patch_integrated_reset_experiment.py tools/japan_port/test_integrated_reset_experiment.py
      - name: Compose all six reset overlays from pinned sources and run double-reset gate unit
        env:
          JP_INTEGRATED_EMIT_DIR: ${{ runner.temp }}/jp-integrated
        run: python3 tools/japan_port/test_integrated_reset_experiment.py -v
      - name: C++ syntax-check all six generated reset owners
        run: |
          set -eu
          ROOT=lib/N64ModernRuntime
          # CMake normally generates this miniz export header in its build
          # tree; source-only compile needs a neutral static-build stub.
          printf '#pragma once\n#define MINIZ_EXPORT\n#define MINIZ_NO_EXPORT\n' > "${RUNNER_TEMP}/jp-integrated/miniz_export.h"
          CXXFLAGS=(
            -I"${RUNNER_TEMP}/jp-integrated"
            -std=c++20 -fsyntax-only -Wall -Wextra -Wno-unused-parameter
            -DGOEMON_JP_EXPERIMENTAL_RESET_BACKEND_ACTIVE
            -I"${ROOT}/ultramodern/include"
            -I"${ROOT}/librecomp/include"
            -I"${ROOT}/librecomp/include/librecomp"
            -I"${ROOT}/librecomp/src"
            -I"${ROOT}/thirdparty/concurrentqueue"
            -I"${ROOT}/thirdparty/miniz"
            -I"${ROOT}/thirdparty"
            -I"${ROOT}/N64Recomp/include"
            -I"${ROOT}/N64Recomp/lib/rabbitizer/include"
            -I"${ROOT}/N64Recomp/lib/rabbitizer/cplusplus/include"
            -I"${ROOT}/N64Recomp/lib/fmt/include"
            -I"${ROOT}/N64Recomp/lib/tomlplusplus/include"
            -I"${ROOT}/ultramodern/src"
            -Isrc/game
            -Iinclude
          )
          for name in threads_reset.cpp mesgqueue_integrated.cpp events_integrated.cpp timer_integrated.cpp pi_integrated.cpp recomp_integrated.cpp; do
            echo "::group::Checking ${name}"
            g++ "${CXXFLAGS[@]}" "${RUNNER_TEMP}/jp-integrated/${name}"
            echo "::endgroup::"
          done
