name: Japan port metadata checks

on:
  push:
    branches:
      - feature/japan-native-recomp
  pull_request:
    paths:
      - "tools/japan_port/**"
      - ".github/workflows/japan-port-metadata.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install metadata parser dependency
        run: python -m pip install "PyYAML==6.0.2"
      - name: Unit tests (no ROMs or game assets)
        run: python -m unittest discover -s tools/japan_port -p "test_*.py" -v
