name: Japan port local Debian build prerequisites

on:
  workflow_dispatch:
  push:
    branches: [feature/japan-native-recomp]
    paths: [".github/workflows/japan-port-debian-sdk.yml"]

permissions:
  contents: read

jobs:
  debian-dev-packages:
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie
    steps:
      - name: Prepare Debian 13 development packages offline bundle
        run: |
          set -eu
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          mkdir -p /github/workspace/build-sdk/partial
          apt-get -y -o APT::Keep-Downloaded-Packages=true \
            -o Dir::Cache::archives=/github/workspace/build-sdk install \
            --no-install-recommends \
            libsdl2-dev libgtk-3-dev libfreetype-dev \
            libvulkan-dev libx11-dev libxi-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev \
            libxss-dev libxext-dev libdbus-1-dev
          find /github/workspace/build-sdk -maxdepth 1 -name '*.deb' -printf '%f\n' > /github/workspace/build-sdk/PACKAGES.txt
          test "$(wc -l < /github/workspace/build-sdk/PACKAGES.txt)" -ge 8
          wc -l /github/workspace/build-sdk/PACKAGES.txt
          du -sh /github/workspace/build-sdk
          printf 'Debian trixie x86-64 SDK package bundle. No Nintendo game data.\n' > /github/workspace/build-sdk/README.txt
      - name: Upload Debian development packages
        uses: actions/upload-artifact@v4
        with:
          name: goemon-japan-debian13-dev-sdk
          path: build-sdk/
          if-no-files-found: error
          retention-days: 2
